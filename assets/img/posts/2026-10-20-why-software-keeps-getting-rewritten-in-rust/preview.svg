<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
<title id="title">Keep the interface. Change the engine.</title>
<desc id="desc">Conceptual architecture showing familiar interfaces above a replaceable Rust engine, with native, embedded, and WebAssembly deployment choices below.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11151d"/><stop offset="1" stop-color="#10252b"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#adc5c8" stroke-width="1.3"/></marker></defs>
<rect width="1400" height="788" rx="20" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="80" y="82" font-size="32" fill="#f1eee8" font-weight="650">Keep the interface. Change the engine.</text>
<text x="80" y="123" font-size="21" fill="#9fbbc0">A common pattern across compiler, tooling, and data-processing projects</text>
<g fill="#192d37" stroke="#42616b" stroke-width="2"><rect x="80" y="175" width="380" height="106" rx="14"/><rect x="510" y="175" width="380" height="106" rx="14"/><rect x="940" y="175" width="380" height="106" rx="14"/></g>
<g fill="#edf6f7" font-size="27" text-anchor="middle"><text x="270" y="220">Language / API</text><text x="700" y="220">CLI / editor</text><text x="1130" y="220">Query / protocol</text></g>
<g fill="#a9c3cb" font-size="20" text-anchor="middle"><text x="270" y="255">Keep the user's contract</text><text x="700" y="255">Keep familiar entry points</text><text x="1130" y="255">Keep expected behavior</text></g>
<g fill="none" stroke="#adc5c8" stroke-width="2.5" marker-end="url(#arrow)"><path d="M270 281V346"/><path d="M700 281V346"/><path d="M1130 281V346"/></g>
<rect x="80" y="353" width="1240" height="142" rx="15" fill="#362b29" stroke="#c08366" stroke-width="2"/>
<text x="118" y="401" font-size="30" fill="#ffd6b7" font-weight="650">Rust implementation of selected expensive work</text>
<text x="118" y="445" font-size="22" fill="#ecd0bd">Explicit data layout</text><text x="460" y="445" font-size="22" fill="#ecd0bd">Ownership and borrowing</text><text x="900" y="445" font-size="22" fill="#ecd0bd">Native execution</text>
<g fill="none" stroke="#adc5c8" stroke-width="2.5" marker-end="url(#arrow)"><path d="M270 495V561"/><path d="M700 495V561"/><path d="M1130 495V561"/></g>
<g fill="#153531" stroke="#3a8c80" stroke-width="2"><rect x="80" y="568" width="380" height="104" rx="14"/><rect x="510" y="568" width="380" height="104" rx="14"/><rect x="940" y="568" width="380" height="104" rx="14"/></g>
<g fill="#a6e8dc" font-size="26" text-anchor="middle"><text x="270" y="611">Native binary</text><text x="700" y="611">Embedded library</text><text x="1130" y="611">WebAssembly</text></g>
<g fill="#a5c7c1" font-size="19" text-anchor="middle"><text x="270" y="645">Developer machine / server</text><text x="700" y="645">Inside an existing application</text><text x="1130" y="645">Where the target is supported</text></g>
<text x="80" y="736" font-size="19" fill="#9eb5bb">Conceptual choices, not a claim that every project implements every interface or target.</text>
</g>
</svg>
