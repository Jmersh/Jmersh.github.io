<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788"><rect width="1400" height="788" rx="22" fill="#101c24"/><g font-family="Segoe UI,Arial,sans-serif"><text x="68" y="85" fill="#edf3ec" font-size="34" font-weight="600">Four things durable ownership needs</text><text x="68" y="127" fill="#a7bbb9" font-size="23">A useful product should have a route through each failure.</text><g transform="translate(68 180)"><rect width="614" height="240" rx="16" fill="#192b33" stroke="#31494e"/><text x="30" y="50" fill="#eac18a" font-size="24" font-weight="600">01 / PARTS</text><text x="30" y="114" fill="#edf3ec" font-size="32" font-weight="600">Replace what wears out</text><text x="30" y="161" fill="#b8c8c5" font-size="23">Parts, instructions, fair prices.</text><path d="M30 196H580" stroke="#eac18a" opacity=".45" stroke-width="2"/></g><g transform="translate(718 180)"><rect width="614" height="240" rx="16" fill="#192b33" stroke="#31494e"/><text x="30" y="50" fill="#9edbc4" font-size="24" font-weight="600">02 / DIAGNOSTICS</text><text x="30" y="114" fill="#edf3ec" font-size="32" font-weight="600">Complete the repair</text><text x="30" y="161" fill="#b8c8c5" font-size="23">Fault codes, calibration, pairing.</text><path d="M30 196H580" stroke="#9edbc4" opacity=".45" stroke-width="2"/></g><g transform="translate(68 458)"><rect width="614" height="240" rx="16" fill="#192b33" stroke="#31494e"/><text x="30" y="50" fill="#9cc6df" font-size="24" font-weight="600">03 / CONTINUITY</text><text x="30" y="114" fill="#edf3ec" font-size="32" font-weight="600">Survive the shutdown</text><text x="30" y="161" fill="#b8c8c5" font-size="23">Essential functions work locally.</text><path d="M30 196H580" stroke="#9cc6df" opacity=".45" stroke-width="2"/></g><g transform="translate(718 458)"><rect width="614" height="240" rx="16" fill="#192b33" stroke="#31494e"/><text x="30" y="50" fill="#c5b1de" font-size="24" font-weight="600">04 / PORTABILITY</text><text x="30" y="114" fill="#edf3ec" font-size="32" font-weight="600">Keep your work</text><text x="30" y="161" fill="#b8c8c5" font-size="23">Open, edit, and move your files.</text><path d="M30 196H580" stroke="#c5b1de" opacity=".45" stroke-width="2"/></g></g></svg>